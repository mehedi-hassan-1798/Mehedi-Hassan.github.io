bio: |
  I am an Instructor in the Department of Electrical Engineering and
  Computer Science at the University of Arkansas. I earned my Ph.D.
  in Computer Science from the University of Louisiana at Lafayette,
  where I worked with Dr. Mehmet Engin Tozal.

  My research lies at the intersection of cybersecurity, machine
  learning, and complex networked systems. I develop methods for
  detecting anomalous communication behaviors and suspicious links
  in dynamically evolving networks.

  I also collaborate with the Center for Computational & Data Sciences
  at Independent University, Bangladesh.

