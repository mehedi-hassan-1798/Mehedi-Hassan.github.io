bio: 'I am an Instructor in the Department of Electrical Engineering and Computer
  Science at the University of Arkansas. I earned my Ph.D. in Computer Science from
  the University of Louisiana at Lafayette in 2024, advised by Dr. Mehmet Engin Tozal.
  My dissertation examined anomalous link detection in dynamically evolving complex
  systems.


  My research combines machine learning, cybersecurity, and network science to detect
  suspicious communications and emerging threats in evolving networks. My work includes
  probabilistic network models, spectral representations, graph attention networks,
  and payload embeddings. I also collaborate on applied machine learning and health
  informatics research.


  Previously, I was a Visiting Instructor at Georgia Southern University and a Lecturer
  at Green University of Bangladesh. I collaborate with the Center for Computational
  & Data Sciences at Independent University, Bangladesh.'
